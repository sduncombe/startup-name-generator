# ============================================================================
# SAMPLE DATA ONLY. NOT A TRADEMARK DATABASE.
# ============================================================================
#
# This is a tiny demonstration dataset (a few dozen famous marks) so that
# contributors can clone the repository and run the app immediately. It is
# NOT a meaningful screen of the USPTO register and must not be relied on.
#
# For production-quality screening, import the official USPTO bulk data:
#
#   python tools/import_uspto.py apc*.zip -o data/uspto-trademarks.json
#   TRADEMARK_DATA_PATH=data/uspto-trademarks.json
#
# The screening engine consumes any dataset in this format (YAML or JSON):
#   meta:  { name, sample (bool), source }
#   marks: [{ mark, status: live|pending|dead, classes: [int], owner }]

meta:
  name: Built-in sample dataset
  sample: true
  source: A handful of famous marks from public USPTO records, for demo only

