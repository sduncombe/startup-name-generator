# Bundled trademark screening dataset.
#
# Derived from public USPTO records: each entry is a well-known, currently
# registered (live) US wordmark with its primary Nice classes. This is a
# screening aid, not the full register. For deeper coverage, point
# TRADEMARK_DATA_PATH at a larger file in the same format built from the
# official USPTO bulk data (https://data.uspto.gov/ bulk XML). No scraping.
#
# status: live | pending | dead

# Maps brief keywords to likely Nice classes so "similar mark, same industry"
# can be weighted above "similar mark, unrelated industry".
