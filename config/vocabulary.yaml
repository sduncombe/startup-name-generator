# Phrase templates for descriptive combinations (tokens replaced by vocab)
phrase_templates:
  - "{verb} it {noun}"
  - "{noun} {verb}"
  - "{verb} {noun}"
  - "{noun} check"
  - "{noun} {benefit}"
  - "{verb} it here"
  - "{noun} {modifier}"
  - "fits {noun}"
  - "see it {noun}"
  - "try it {noun}"
  - "place it {noun}"
  - "{benefit} {noun}"
