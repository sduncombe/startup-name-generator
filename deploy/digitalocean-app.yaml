# DigitalOcean App Platform spec (reference) for standalone Python self-host.
# Production Namegen lives in duncombe-web at /apps/namegen.
# Deploy from the startup-name-generator repo only for a separate instance.

name: startup-name-generator
region: nyc
services:
  - name: web
    github:
      repo: sduncombe/startup-name-generator
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: ALLOW_SERVER_LLM_KEYS
        value: "false"
        scope: RUN_TIME
      - key: HOST
        value: "0.0.0.0"
        scope: RUN_TIME
      - key: PORT
        value: "8000"
        scope: RUN_TIME
      - key: DATABASE_PATH
        value: "/data/runs.db"
        scope: RUN_TIME
      - key: PUBLIC_APP_URL
        value: "https://your-host.example"
        scope: RUN_TIME
      - key: GITHUB_REPO_URL
        value: "https://github.com/sduncombe/startup-name-generator"
        scope: RUN_TIME
      - key: DOMAIN_PROVIDER
        value: "rdap"
        scope: RUN_TIME
    # Persist SQLite across deploys (attach a volume named sn-data → /data)
    # Configure the volume in the DO UI or extend this spec with volumes.
